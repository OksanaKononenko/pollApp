 <div class="welcome-container">
  
  <h1 class="welcome-title">
    👋 Вітаємо в Системі Опитувань!
  </h1>

  <!-- БЛОК ДЛЯ ГОСТЕЙ -->
  <div *ngIf="!isLoggedIn">
    <p class="welcome-text">
      Щоб переглянути список доступних питань та взяти участь у голосуванні, вам необхідно увійти в систему або створити новий акаунт.
    </p>
    
    <a routerLink="/login" class="btn btn-primary">
      🔒 Увійти / Зареєструватися
    </a>
  </div>

  <!-- БЛОК ДЛЯ ЗАЛОГІНЕНИХ КОРИСТУВАЧІВ -->
  <div *ngIf="isLoggedIn">
    <p class="success-text">
      Ви успішно авторизовані в системі!
    </p>
    <a routerLink="/polls" class="btn btn-success">
      👉 Перейти до списку опитувань
    </a>
  </div>

</div>
